name: Workflow server

on:
  push:
    paths: ["server/**", "backend/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "backend/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aves
          POSTGRES_PASSWORD: aves
          POSTGRES_DB: aves_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aves" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
          pip install "numpy>=1.26" "Pillow>=10.0" "pillow-heif>=0.20" "gpxpy>=1.6" "onnxruntime>=1.20" -e "server[dev]"
      - name: Build the web UI
        working-directory: server/web
        run: npm ci && npm run build
      - name: Tests (SQLite)
        working-directory: server
        run: pytest -q
      - name: Tests (PostgreSQL)
        working-directory: server
        env:
          AVES_TEST_DATABASE_URL: postgresql+psycopg://aves:aves@localhost:5432/aves_test
        run: pytest -q

  image:
    # Publishes ghcr.io/<owner>/aves-caesar-workflow so Portainer can pull it instead of building on the NAS.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aves-caesar-workflow" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name == 'truenas-workflow' && 'latest' || github.ref_name }}
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
