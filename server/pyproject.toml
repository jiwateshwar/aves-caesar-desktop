[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aves-server"
dynamic = ["version"]
description = "Featherbase: a bird-first photo workflow (ingest, AI-assisted species identification, review, publishing) built on the Aves Caesar models"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "reverse_geocode==1.6.6",
    "scipy>=1.13",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["aves_server*"]

[tool.setuptools.package-data]
aves_server = ["static/**/*"]

[tool.setuptools.dynamic]
version = { attr = "aves_server.__version__" }

[tool.pytest.ini_options]
pythonpath = [".", "../backend"]
testpaths = ["tests"]
markers = ["models: needs the real Aves Caesar model files (slow)"]
